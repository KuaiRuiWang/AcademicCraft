<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="sample-title sample-desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18">
  <title id="sample-title">应用系统架构</title>
  <desc id="sample-desc">应用页面经业务接口访问数据存储。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333333"/></marker></defs>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <g data-edge-id="e1" data-from="A" data-to="B"><path d="M200 160 H280" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/></g>
  <g data-edge-id="e2" data-from="B" data-to="C"><path d="M440 160 H520" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/></g>
  <g data-node-id="A"><rect x="40" y="120" width="160" height="80" rx="6" fill="#ffffff" stroke="#333333"/><text x="120" y="166" text-anchor="middle" fill="#222222">应用页面</text></g>
  <g data-node-id="B"><rect x="280" y="120" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#333333"/><text x="360" y="166" text-anchor="middle" fill="#222222">业务接口</text></g>
  <g data-node-id="C"><rect x="520" y="120" width="160" height="80" rx="6" fill="#ffffff" stroke="#333333"/><text x="600" y="166" text-anchor="middle" fill="#222222">数据存储</text></g>
</svg>

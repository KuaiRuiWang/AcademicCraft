spring:
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  application:
    name: wkr-ai-code-mother-backend
  profiles:
    active: dev
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}
    username: ${mysql.username}
    password: ${mysql.password}
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}
      ttl: 3600
      database: 1
      username: default
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.wkr.aicode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
deepseek:
  model-name: deepseek-flash

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: ${deepseek.model-name}
      log-requests: true
      log-responses: true
      max-tokens: 16384
      max-retries: 3
    #      strict-json-schema: true
#      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: ${deepseek.model-name}
      max-tokens: 16384
      log-requests: true
      log-responses: true
    # AI 模型配置
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: ${deepseek.model-name}
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: ${deepseek.model-name}
      log-requests: true
      log-responses: true

# minio对象存储
minio:
  endpoint: ${minio.endpoint}
  access-key: ${minio.access-key}
  secret-key: ${minio.secret-key}

# pexels搜索API
pexels:
  api-key: ${pexels.api-key}

# 阿里云大模型
aliyun:
  dashscope :
    api-key: ${aliyun.dashscope.api-key}
    model-id: ${aliyun.dashscope.model-id}

# 监控参数
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# 全栈应用容器部署：动态 Nginx 配置目录与 openresty 容器名（生产默认值）
app:
  nginx:
    conf-dir: /baiye/1panel/www/sites/ai-code/proxy/apps
    container-name: 1Panel-openresty-D1L0
    # nginx 容器访问应用端口的地址：生产 openresty 为 host 网络用 127.0.0.1；本地 bridge 网络验证用 host.docker.internal
    upstream-host: 127.0.0.1
